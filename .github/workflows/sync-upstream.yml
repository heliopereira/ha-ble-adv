name: Sync Upstream (NicoIIT/ha-ble-adv)

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  # Permite disparar manualmente pela aba Actions do GitHub a qualquer momento
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    name: Sincronizar com Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Identidade do Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verificar Atualizações no Repositório Original
        id: check_upstream
        run: |
          git remote add upstream https://github.com/NicoIIT/ha-ble-adv.git || git remote set-url upstream https://github.com/NicoIIT/ha-ble-adv.git
          git fetch upstream main
          
          # Conta quantos commits o original tem que nós não temos
          UPSTREAM_COMMITS=$(git rev-list --count HEAD..upstream/main)
          echo "Commits novos encontrados: $UPSTREAM_COMMITS"
          echo "count=$UPSTREAM_COMMITS" >> $GITHUB_OUTPUT
          
          if [ "$UPSTREAM_COMMITS" -gt 0 ]; then
            COMMITS_LIST=$(git log --oneline HEAD..upstream/main | sed ':a;N;$!ba;s/\n/\\n/g' | sed 's/"/\\"/g')
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "log=$COMMITS_LIST" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Realizar Merge Automático
        if: steps.check_upstream.outputs.has_updates == 'true'
        id: do_merge
        run: |
          git merge upstream/main -m "chore(sync): merge upstream changes from NicoIIT/ha-ble-adv"
          git push origin main

      - name: Notificar Usuário via Issue no GitHub
        if: steps.check_upstream.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commits = `${{ steps.check_upstream.outputs.log }}`.replace(/\\n/g, '\n');
            const body = [
              '### O robô sincronizou novidades do projeto original!',
              '',
              'As seguintes alterações foram mescladas com sucesso na branch `main`:',
              '```text',
              commits,
              '```',
              '',
              'Elas já estão disponíveis no seu fork e prontas para atualizar no seu Home Assistant através do HACS!'
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚀 [Sincronização Automática] Novas atualizações recebidas de NicoIIT/ha-ble-adv',
              body: body
            });

      - name: Notificar em Caso de Conflito
        if: failure() && steps.check_upstream.outputs.has_updates == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ [Atenção] Conflito detectado na sincronização automática',
              body: 'Ocorreu um conflito ao tentar mesclar automaticamente as alterações recentes de `NicoIIT/ha-ble-adv`. Por favor, resolva o conflito no seu Git local ou me avise para eu te ajudar!'
            });
